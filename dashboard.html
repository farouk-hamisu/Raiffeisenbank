<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — marvintlc</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="page-loader" id="page-loader" role="status" aria-live="polite">
    <div class="pl-inner">
      <div class="pl-orbit">
        <span class="pl-ring"></span>
        <span class="pl-ring pl-ring--2"></span>
        <span class="pl-ring pl-ring--3"></span>
        <span class="pl-core"></span>
      </div>
      <div class="pl-track"><span class="pl-progress"></span></div>
      <p class="pl-status" id="pl-status">Preparing your workspace</p>
    </div>
  </div>
  <div id="page-root">
    <div class="dash-layout">
      <!-- Header Section -->
      <div class="dash-header">
        <div class="dash-header-left">
          <div id="dash-avatar" class="dash-avatar"></div>
          <div class="dash-greeting">
            <p id="dash-user-name" class="dash-user-name"></p>
            <h1 id="dash-greeting-text" class="dash-greeting-text"></h1>
          </div>
        </div>
        <div class="dash-header-right">
          <a href="notifications.html" class="dash-notif-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </a>
        </div>
      </div>

      <!-- Balance Card -->
      <div class="dash-balance-card" id="dash-balance-card">
        <div class="dash-balance-label">Total balance</div>
        <div class="dash-balance-amount" id="dash-total-balance">$0.00</div>
        <div class="dash-balance-change" id="dash-balance-change">
          <span class="dash-change-positive">+$0.00 this week</span>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="dash-quick-actions">
        <a class="dash-quick-action" href="local-transfer.html">
          <div class="dash-qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </div>
          <span>Send</span>
        </a>
        <a class="dash-quick-action" href="deposits.html">
          <div class="dash-qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>
          </div>
          <span>Deposit</span>
        </a>
        <a class="dash-quick-action" href="bitcoin.html">
          <div class="dash-qa-icon">
            <img src="assets/logos/bitcoin-logo-svgrepo-com.svg" alt="Bitcoin" style="width:24px;height:24px">
          </div>
          <span>Bitcoin</span>
        </a>
        <a class="dash-quick-action" href="loans.html">
          <div class="dash-qa-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>
          </div>
          <span>Loans</span>
        </a>
      </div>

      <!-- Card Preview -->
      <div class="dash-card-preview" id="dash-card-preview">
        <div class="dash-card-bank">marvintlc</div>
        <div class="dash-card-number">•••• •••• •••• ••••</div>
        <div class="dash-card-status">Active</div>
      </div>

      <!-- Recent Activity -->
      <div class="dash-recent-activity">
        <div class="dash-section-header">
          <h3>Recent Activity</h3>
          <a href="transactions.html" class="dash-view-all">View All</a>
        </div>
        <div id="dash-transactions">
          <div class="loading-block"><div class="spinner"></div><span>Loading transactions...</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/btc-price.js"></script>
  <script src="js/exchange-rates.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
